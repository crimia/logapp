<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>기록</title>
<style>
  :root{
    --paper:#eceff2; --surface:#fff; --ink:#15222c; --muted:#67798a;
    --rule:#d3dbe2; --rule-soft:#e6ebef;
    --c0:#2f7d6f; --c1:#4a5f9e; --c2:#8a6a3d; --c3:#8a3d4f; --c4:#3d6a8a; --c5:#6a6a3d;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .app{max-width:560px;margin:0 auto;min-height:100vh}

  .top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--rule);
       padding-top:env(safe-area-inset-top)}
  .bar{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px}
  .month{font-size:17px;font-weight:640;letter-spacing:-.01em}
  .nav{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;padding:0 5px;cursor:pointer}
  .nav:hover{color:var(--ink)}
  .bar .spacer{flex:1}
  .status{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;
          min-width:0;overflow:hidden;text-overflow:ellipsis}
  .status.err{color:#a33}
  .gear{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px}
  .gear:hover{color:var(--ink)}

  .grid-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .grid-scroll::-webkit-scrollbar{height:0}
  .grid{display:grid;grid-auto-rows:min-content;width:max-content}
  .corner,.rowlabel{position:sticky;left:0;z-index:2;background:var(--surface);
                    border-right:1px solid var(--rule-soft)}
  .corner{height:30px}
  .dayhead{font:inherit;background:none;border:0;padding:2px 0 4px;cursor:pointer;
           display:flex;flex-direction:column;align-items:center;border-bottom:2px solid transparent}
  .dayhead .dow{font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.3}
  .dayhead .num{font-family:var(--mono);font-size:11.5px;line-height:1.3;font-variant-numeric:tabular-nums}
  .dayhead.weekend .dow,.dayhead.weekend .num{color:#9aa9b5}
  .dayhead.is-today{border-bottom-color:var(--ink)}
  .dayhead.is-today .num{font-weight:700}
  .dayhead.sel{background:#e3e9ee}
  .rowlabel{font:inherit;font-size:12px;color:var(--muted);border:0;
            border-right:1px solid var(--rule-soft);text-align:left;
            padding:0 8px 0 14px;cursor:pointer;height:26px;
            max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowlabel.sel{color:var(--ink);font-weight:620}
  .cell{height:26px;border:0;background:none;cursor:pointer;padding:0;
        display:flex;align-items:center;justify-content:center}
  .cell.sel{background:#e3e9ee}
  .mk{width:9px;height:9px;border-radius:1px}
  .mk.none{width:3px;height:3px;border-radius:50%;background:var(--rule)}
  .mk.open{border:1.5px solid currentColor}
  .mk.full{background:currentColor}

  .viewhead{display:flex;align-items:baseline;gap:9px;padding:16px 14px 8px}
  .viewhead h2{margin:0;font-size:16px;font-weight:640;letter-spacing:-.01em}
  .viewhead .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  .stack{padding:0 14px 90px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--rule-soft);
        border-left:2px solid currentColor;border-radius:4px;padding:11px 13px 13px}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .card-name{font:inherit;font-size:12.5px;font-weight:620;color:currentColor;
             background:none;border:0;padding:0;cursor:pointer}
  .card-top .spacer{flex:1}
  .rawbtn{font:inherit;font-size:11px;color:var(--muted);background:none;border:0;
          padding:2px 4px;cursor:pointer;border-radius:3px}
  .rawbtn:hover{color:var(--ink);background:var(--paper)}

  .sect{margin-top:9px}
  .sect:first-of-type{margin-top:0}
  .sect h3{margin:0 0 5px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .note{color:var(--ink);font-size:14px;margin:0;white-space:pre-wrap}

  ul.items{list-style:none;margin:0;padding:0}
  li.item{padding:2px 0}
  .row{display:flex;gap:9px;align-items:flex-start}
  .box{flex:0 0 auto;margin-top:3px;width:15px;height:15px;border-radius:3px;
       border:1.5px solid var(--rule);background:var(--surface);cursor:pointer;padding:0;
       display:flex;align-items:center;justify-content:center}
  .box.on{background:currentColor;border-color:currentColor}
  .box svg{width:9px;height:9px;opacity:0;transition:opacity .12s ease}
  .box.on svg{opacity:1}
  .txt{flex:1;font-size:14.5px;line-height:1.5}
  .item.done .txt{color:var(--muted)}
  .addc{flex:0 0 auto;font:inherit;font-size:16px;line-height:1;color:var(--rule);
        background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:3px}
  .addc:hover{color:var(--ink);background:var(--paper)}
  .cmts{list-style:none;margin:3px 0 4px 14px;padding:0 0 0 10px;border-left:2px solid currentColor}
  .cmts li{font-size:13.5px;line-height:1.5;color:var(--ink);padding:1px 0}

  .inline{display:flex;gap:6px;margin:4px 0 6px 24px}
  .inline input{flex:1;font:inherit;font-size:13.5px;padding:5px 8px;min-width:0;
                border:1px solid var(--rule);border-radius:3px;background:var(--surface);color:var(--ink)}
  .inline button{font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer;
                 border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px}
  .additem{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;
           padding:4px 0 0 24px;cursor:pointer}
  .additem:hover{color:var(--ink)}

  pre.raw{margin:9px 0 0;padding:10px;background:#f6f8f9;border:1px solid var(--rule-soft);
          border-radius:3px;font-family:var(--mono);font-size:11.5px;line-height:1.6;
          color:#3c4b57;white-space:pre-wrap;word-break:break-all}

  .empty{border:1px dashed var(--rule);border-radius:4px;padding:12px 13px;
         display:flex;align-items:center;gap:10px}
  .empty .name{font-size:12.5px;font-weight:620;color:currentColor}
  .empty .msg{font-size:13px;color:var(--muted);flex:1}
  .empty button{font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;
                border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px}

  .datehead{display:flex;align-items:baseline;gap:8px;padding:14px 0 2px}
  .datehead:first-child{padding-top:0}
  .datehead button{font:inherit;font-family:var(--mono);font-size:12.5px;font-weight:600;
                   color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
  .datehead .dow2{font-size:11.5px;color:var(--muted)}

  /* 대기(오프라인 큐) 표시 */
  .pending{font:inherit;font-family:var(--mono);font-size:10.5px;color:#8a6a1d;
           background:none;border:0;padding:0 2px;cursor:pointer;white-space:nowrap}
  .pending:hover{color:var(--ink)}

  /* 패널 (내보내기 · 주제) */
  .panel{background:var(--surface);border:1px solid var(--rule-soft);border-radius:4px;padding:11px 13px 13px}
  .phead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .phead h3{margin:0;font-size:12.5px;font-weight:620;color:var(--ink)}
  .phead .sub{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .phead .spacer{flex:1}
  .pbtn{font:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border:1px solid var(--rule);
        background:var(--surface);color:var(--ink);border-radius:3px}
  .pbtn:hover{border-color:var(--ink)}
  .pbtn.solid{border-color:var(--ink);background:var(--ink);color:#fff}
  .pbtn:disabled{opacity:.4;cursor:default;border-color:var(--rule)}
  .pnote{font-size:11.5px;color:var(--muted);line-height:1.55;margin:9px 0 0}
  .pnote.warn{color:#a33}
  pre.export{max-height:44vh;overflow:auto;white-space:pre;word-break:normal;margin-top:0}

  ul.tlist{list-style:none;margin:0 0 10px;padding:0}
  ul.tlist li{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--rule-soft)}
  ul.tlist .sw{flex:0 0 auto;width:9px;height:9px;border-radius:1px;background:currentColor}
  ul.tlist .nm{flex:1;font-size:14px;color:var(--ink)}
  ul.tlist .none{font-size:13px;color:var(--muted)}
  .hidebtn{font:inherit;font-size:11.5px;color:var(--muted);background:none;border:0;
           padding:3px 6px;cursor:pointer;border-radius:3px}
  .hidebtn:hover{color:#a33;background:var(--paper)}

  /* 항목 편집 (⋯ 버튼) */
  .editb{font-size:13px;letter-spacing:.5px}
  .editwrap{margin:5px 0 7px 24px}
  .edit{display:flex;gap:6px;align-items:center}
  .edit input{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:5px 8px;
              border:1px solid var(--ink);border-radius:3px;background:var(--surface);color:var(--ink)}
  .edit .save{font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer;
              border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px}
  .editbar{display:flex;gap:6px;align-items:center;margin-top:5px}
  .editbar .spacer{flex:1}
  .movebtn{font:inherit;font-size:11.5px;color:var(--ink);background:var(--surface);
           border:1px solid var(--rule);border-radius:3px;padding:4px 8px;cursor:pointer}
  .movebtn:hover:not(:disabled){border-color:var(--ink)}
  .movebtn:disabled{opacity:.35;cursor:default}
  .delbtn{font:inherit;font-size:11px;color:var(--muted);background:none;
          border:1px solid var(--rule);border-radius:3px;padding:4px 6px;cursor:pointer}
  .delbtn:hover{color:#fff;background:#a33;border-color:#a33}

  .viewhead .spacer{flex:1}

  /* setup */
  .setup{max-width:400px;margin:0 auto;padding:48px 22px}
  .setup h1{font-size:19px;font-weight:640;margin:0 0 6px;letter-spacing:-.01em}
  .setup p.lead{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.6}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%;font:inherit;font-size:15px;padding:9px 11px;
             border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
  .fld .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
  .setup .go{width:100%;font:inherit;font-size:15px;font-weight:600;padding:11px;
             margin-top:10px;cursor:pointer;border:0;border-radius:4px;background:var(--ink);color:#fff}
  .setup .msg{font-size:13px;color:#a33;margin-top:12px;line-height:1.5;min-height:1em}
  .setup .out{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;
              padding:14px 0 0;cursor:pointer;text-decoration:underline}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><div id="root"></div>
<script>
"use strict";

/* ═══ 설정 ═══════════════════════════════════════════ */
const CFG_KEY = "celllog.cfg";
const LOGDIR  = "log";
let CFG = null;
try { CFG = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch(e){}

/* ═══ 깃허브 API ═════════════════════════════════════
   서버 없음. 브라우저에서 직접 호출하고 커밋한다.     */
const API = "https://api.github.com";
const hdr = () => ({
  Authorization: "Bearer " + CFG.token,
  Accept: "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28",
});
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const repoURL = p => `${API}/repos/${CFG.owner}/${CFG.repo}/contents/${encPath(p)}`;

function b64d(s){
  const bin = atob(s.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function b64e(s){
  let bin = "";
  new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function why(r){
  let m = ""; try { m = (await r.json()).message || ""; } catch(e){}
  if (r.status === 401) return "토큰이 거부됐습니다. 만료됐거나 잘못 복사됐습니다.";
  if (r.status === 403) return "권한이 없습니다. 토큰에 Contents 쓰기 권한과 이 저장소가 포함됐는지 확인하세요.";
  if (r.status === 404) return "저장소를 못 찾았습니다. 계정명·저장소명, 그리고 토큰의 저장소 선택을 확인하세요.";
  return `${r.status} ${m}`;
}

const httpErr = async r => Object.assign(new Error(await why(r)), { status: r.status });

async function ghList(dir){
  const r = await fetch(repoURL(dir) + "?ref=" + CFG.branch, { headers: hdr() });
  if (r.status === 404) return [];
  if (!r.ok) throw await httpErr(r);
  const j = await r.json();
  return Array.isArray(j) ? j : [];
}
async function ghRead(path){
  const r = await fetch(repoURL(path) + "?ref=" + CFG.branch, { headers: hdr() });
  if (r.status === 404) return null;
  if (!r.ok) throw await httpErr(r);
  const j = await r.json();
  return { text: b64d(j.content), sha: j.sha };
}
async function ghWrite(path, text, sha, msg){
  const body = { message: msg, content: b64e(text), branch: CFG.branch };
  if (sha) body.sha = sha;
  const r = await fetch(repoURL(path), {
    method: "PUT",
    headers: { ...hdr(), "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw await httpErr(r);
  return (await r.json()).content.sha;
}

/* ═══ 상태 ═══════════════════════════════════════════ */
const pad  = n => String(n).padStart(2,"0");
// toISOString()은 UTC다. 한국은 자정부터 아침 9시까지 어제가 나온다.
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let TODAY = localDate();
const S = {
  view:"date", ym:TODAY.slice(0,7), date:TODAY, topic:null,
  topics:[], store:{}, present:new Set(),
  raw:new Set(), open:null, status:"", err:false, loading:true,
  exportOpen:false, topicsOpen:false, topicMsg:"", focusEdit:false,
};
const DOW  = ["일","월","화","수","목","금","토"];
const dow  = d => DOW[new Date(d+"T00:00:00").getDay()];
const nfc  = s => s.normalize("NFC");
const cellPath = (d,t) => `${LOGDIR}/${d.slice(0,7)}/${d}__${nfc(t)}.md`;
const cellName = (d,t) => `${d}__${nfc(t)}`;
const TOPICS_PATH = "topics.json";
const DEFAULT_TOPICS = ["운동","스케쥴","사주"];
const daysIn = ym => new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
const tcolor = t => `var(--c${S.topics.indexOf(t) % 6})`;
const TEMPLATE = (d,t) => `---\ndate: ${d}\ntopic: ${t}\n---\n## 계획\n- [ ] `;

function setStatus(msg, err){ S.status = msg; S.err = !!err; paintStatus(); }
function paintStatus(){
  const e = document.getElementById("status");
  if (e){ e.textContent = S.status; e.title = S.status; e.className = "status" + (S.err ? " err" : ""); }
  const q = document.getElementById("pending");
  if (q){
    const n = QUEUE.length;
    q.hidden = !n && navigator.onLine;
    q.textContent = n ? `대기 ${n}` : "오프라인";
    q.title = n ? "저장 못 한 편집입니다. 누르면 지금 다시 보냅니다." : "연결이 없습니다.";
  }
}

/* ═══ 로드 ═══════════════════════════════════════════ */
function readTopics(text){
  try { const j = JSON.parse(text); if (Array.isArray(j)) return j.map(nfc); } catch(e){}
  return DEFAULT_TOPICS.slice();       // 파일이 없거나 깨졌을 때만 기본값. 빈 목록은 빈 목록이다
}
async function loadTopics(){
  const f = await ghRead(TOPICS_PATH);
  S.store[TOPICS_PATH] = { text: f ? f.text : "", sha: f ? f.sha : null };
  return readTopics(f ? f.text : "");
}
// topics.json이 바뀌면 화면 목록도 따라간다. 색은 여전히 순서대로다.
function syncTopics(){
  const rec = S.store[TOPICS_PATH];
  if (!rec) return;
  S.topics = readTopics(rec.text);
  if (!S.topic || !S.topics.includes(S.topic)) S.topic = S.topics[0] || null;
  if (S.view === "topic" && !S.topic) S.view = "date";
}
async function loadMonth(ym){
  S.loading = true; setStatus("불러오는 중");
  const entries = (await ghList(`${LOGDIR}/${ym}`))
    .filter(e => e.type === "file" && e.name.endsWith(".md"));
  S.present = new Set();
  for (const e of entries) S.present.add(nfc(e.path));
  render();
  await Promise.all(entries.map(async e => {
    if (S.store[nfc(e.path)]) return;
    try { const c = await ghRead(e.path); if (c) S.store[nfc(e.path)] = c; } catch(err){}
  }));
  S.loading = false; setStatus("");
  render();
}

/* ═══ 파서 (화면용) ══════════════════════════════════ */
function parse(raw){
  const lines = raw.split("\n");
  let i = 0;
  if (lines[0] === "---"){ i = 1; while (i < lines.length && lines[i] !== "---") i++; i++; }
  const blocks = [];
  for (; i < lines.length; i++){
    const line = lines[i]; let m;
    if ((m = line.match(/^##\s+(.*)$/)))              blocks.push({kind:"h", text:m[1]});
    else if ((m = line.match(/^- \[([ xX])\]\s?(.*)$/)))
      blocks.push({kind:"item", done:m[1].toLowerCase()==="x", text:m[2], ln:i, cmts:[]});
    else if ((m = line.match(/^\s{2,}- (.*)$/))){
      const last = blocks[blocks.length-1];
      if (last && last.kind === "item") last.cmts.push(m[1]);
      else blocks.push({kind:"p", text:line.trim()});
    } else if (line.trim()){
      const last = blocks[blocks.length-1];
      if (last && last.kind === "p") last.text += "\n" + line;
      else blocks.push({kind:"p", text:line});
    }
  }
  return blocks;
}

/* ═══ 줄 단위 편집 ═══════════════════════════════════
   파싱 결과를 되돌려 쓰지 않는다. 해당 줄만 손댄다.
   연산은 그냥 객체다. 그래야 오프라인 큐에 실린다.   */
const isItem   = l => /^- \[[ xX]\]/.test(l || "");
const itemText = l => { const m = (l || "").match(/^- \[[ xX]\]\s?(.*)$/); return m ? m[1] : null; };
// 항목에 딸린 실행 코멘트의 끝(다음 줄 번호)
const cmtEnd = (L, ln) => { let at = ln + 1; while (at < L.length && /^\s{2,}- /.test(L[at])) at++; return at; };
const isCmt = l => /^\s{2,}- /.test(l || "");
// 큐에 쌓인 연산이 뒤늦게 다른 텍스트에 닿을 수 있다. 그 줄이 그대로일 때만 손댄다.
const same = (L, ln, prev) => prev == null || itemText(L[ln]) === prev;
// 같은 내용의 항목이 어느 줄로 갔는지. 순서를 바꾼 뒤 편집창을 따라가게 하는 데 쓴다.
function findItemLine(text, s, hint){
  const L = text.split("\n");
  let best = -1;
  for (let i = 0; i < L.length; i++)
    if (isItem(L[i]) && itemText(L[i]) === s && (best < 0 || Math.abs(i-hint) < Math.abs(best-hint))) best = i;
  return best;
}

function applyOp(o, text){
  const L = text.split("\n");
  switch (o.k){
    case "tpl":
      return text.trim() ? text : TEMPLATE(o.d, o.t);        // 이미 쓴 게 있으면 덮지 않는다

    case "toggle":
      if (!isItem(L[o.ln]) || !same(L, o.ln, o.prev)) return text;
      L[o.ln] = /^- \[ \]/.test(L[o.ln]) ? L[o.ln].replace("- [ ]","- [x]")
                                        : L[o.ln].replace(/^- \[[xX]\]/,"- [ ]");
      return L.join("\n");

    case "comment":
      if (!isItem(L[o.ln]) || !same(L, o.ln, o.prev)) return text;
      L.splice(cmtEnd(L, o.ln), 0, "    - " + o.s);
      return L.join("\n");

    case "edit": {                                           // 계획 줄만. 체크 상태와 아래 코멘트는 그대로
      const m = (L[o.ln] || "").match(/^- \[([ xX])\]/);
      if (!m || !same(L, o.ln, o.prev)) return text;
      L[o.ln] = `- [${m[1]}] ` + o.s;
      return L.join("\n");
    }

    case "del":                                              // 딸린 코멘트까지 같이
      if (!isItem(L[o.ln]) || !same(L, o.ln, o.prev)) return text;
      L.splice(o.ln, cmtEnd(L, o.ln) - o.ln);
      return L.join("\n");

    case "move": {                                           // 항목을 딸린 코멘트째 이웃과 맞바꾼다
      if (!isItem(L[o.ln]) || !same(L, o.ln, o.prev)) return text;
      const end = cmtEnd(L, o.ln), block = L.slice(o.ln, end);
      if (o.dir < 0){
        let q = o.ln - 1;
        while (q >= 0 && !L[q].trim()) q--;                  // 사이의 빈 줄은 건너뛴다
        while (q >= 0 && isCmt(L[q])) q--;                   // 앞 항목에 딸린 코멘트
        if (q < 0 || !isItem(L[q])) return text;             // 소제목·본문은 넘지 않는다
        L.splice(o.ln, block.length);
        L.splice(q, 0, ...block);
      } else {
        let q = end;
        while (q < L.length && !L[q].trim()) q++;
        if (q >= L.length || !isItem(L[q])) return text;
        const qEnd = cmtEnd(L, q);
        L.splice(o.ln, block.length);
        L.splice(qEnd - block.length, 0, ...block);
      }
      return L.join("\n");
    }

    case "add": {
      let at = L.length;
      for (let i = L.length - 1; i >= 0; i--)
        if (isItem(L[i]) || /^\s{2,}- /.test(L[i])){ at = i + 1; break; }
      if (L[at-1] !== undefined && L[at-1].trim() === "- [ ]"){ L[at-1] = "- [ ] " + o.s; return L.join("\n"); }
      L.splice(at, 0, "- [ ] " + o.s);
      return L.join("\n");
    }

    case "topicAdd":                                         // topics.json만 건드린다
    case "topicHide": {                                      // 숨김 = 목록에서 빼기. md 파일은 그대로 둔다
      let a = readTopics(text);
      if (o.k === "topicAdd"){ if (!a.includes(o.name)) a.push(o.name); }
      else a = a.filter(x => x !== o.name);
      return JSON.stringify(a) + "\n";
    }
  }
  return text;
}

/* ═══ 오프라인 큐 ════════════════════════════════════
   저장에 실패한 편집을 연산 그대로 쌓아 둔다.
   다시 보낼 때는 늘 최신 파일을 읽어 그 위에 얹는다.  */
const QKEY = "celllog.queue";
let QUEUE = [];
try { const j = JSON.parse(localStorage.getItem(QKEY) || "[]"); if (Array.isArray(j)) QUEUE = j; } catch(e){}
const saveQueue = () => { try { localStorage.setItem(QKEY, JSON.stringify(QUEUE)); } catch(e){} };
// 연결 문제만 쌓는다. 토큰·권한 문제는 다시 보내도 소용없으니 그대로 알린다.
const retryable = e => !e.status || e.status === 409 || e.status === 422 || e.status === 429 || e.status >= 500;
const queuedFor = p => QUEUE.some(j => j.path === p);
function enqueue(path, op, msg){
  QUEUE.push({ path, op, msg, at: Date.now() });
  saveQueue(); paintStatus();
}

let flushing = false;
async function flushQueue(){
  if (flushing || !QUEUE.length || !navigator.onLine || !CFG) { paintStatus(); return; }
  flushing = true;
  setStatus("밀린 편집 보내는 중");
  try {
    while (QUEUE.length){
      const job = QUEUE[0];
      let fresh;
      try { fresh = await ghRead(job.path); }
      catch(e){ setStatus(retryable(e) ? "연결되면 보냄" : e.message, !retryable(e)); return; }
      const base = fresh ? fresh.text : "";
      const next = applyOp(job.op, base);
      if (next === base){ QUEUE.shift(); saveQueue(); continue; }   // 이미 반영됐거나 대상이 사라졌다
      try {
        const sha = await ghWrite(job.path, next, fresh ? fresh.sha : null, job.msg);
        S.store[job.path] = { text: next, sha };
        S.present.add(job.path);
        QUEUE.shift(); saveQueue(); paintStatus();
      } catch(e){
        setStatus(retryable(e) ? "연결되면 보냄" : e.message, !retryable(e));
        return;                                                    // 큐는 그대로 둔다
      }
    }
    setStatus("저장됨");
  } finally { flushing = false; paintStatus(); render(); }
}

/* ═══ 저장 (커밋) ════════════════════════════════════ */
const chains = {};
function mutate(path, op, msg){
  path = nfc(path);
  const rec = S.store[path] || { text:"", sha:null };
  S.store[path] = { text: applyOp(op, rec.text), sha: rec.sha };   // 낙관적 반영
  S.present.add(path);
  render();
  const run = async () => {
    // 이미 밀린 편집이 있는 파일이면 순서를 지켜 큐로 보낸다
    if (!navigator.onLine || queuedFor(path)){
      enqueue(path, op, msg);
      setStatus(navigator.onLine ? "대기열에 넣음" : "오프라인");
      await flushQueue();
      return;
    }
    setStatus("저장 중");
    const cur = S.store[path];
    try {
      const sha = await ghWrite(path, cur.text, cur.sha, msg);
      S.store[path] = { text: cur.text, sha };
      setStatus("저장됨");
    } catch(e){
      if (e.status === 409 || e.status === 422){
        try {
          const fresh = await ghRead(path);          // 밖에서 바뀐 경우
          if (fresh){
            const merged = applyOp(op, fresh.text);
            const sha = await ghWrite(path, merged, fresh.sha, msg);
            S.store[path] = { text: merged, sha };
            setStatus("저장됨");
          }
        } catch(e2){
          if (retryable(e2)){ enqueue(path, op, msg); setStatus("연결되면 보냄"); }
          else setStatus(e2.message, true);
        }
      } else if (retryable(e)){
        enqueue(path, op, msg); setStatus("연결되면 보냄");
      } else setStatus(e.message, true);
    }
    render();
  };
  chains[path] = (chains[path] || Promise.resolve()).then(run).catch(e => setStatus(String(e.message||e), true));
}

/* ═══ 그리기 ═════════════════════════════════════════ */
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

function cellState(d,t){
  const p = cellPath(d,t);
  if (!S.present.has(p)) return "none";
  const rec = S.store[p];
  if (!rec) return "full";
  const items = rec.text.split("\n").filter(l => /^- \[[ xX]\]/.test(l));
  if (!items.length) return "full";
  return items.some(l => /^- \[ \]/.test(l)) ? "open" : "full";
}

function drawGrid(g){
  const N = daysIn(S.ym);
  g.style.gridTemplateColumns = `48px repeat(${N}, 24px)`;
  g.innerHTML = "";
  g.appendChild(el("div","corner"));
  for (let n=1;n<=N;n++){
    const d = `${S.ym}-${pad(n)}`, w = dow(d);
    const b = el("button","dayhead");
    if (w==="토"||w==="일") b.classList.add("weekend");
    if (d===TODAY) b.classList.add("is-today");
    if (S.view==="date" && d===S.date) b.classList.add("sel");
    b.innerHTML = `<span class="dow">${w}</span><span class="num">${n}</span>`;
    b.onclick = () => { S.view="date"; S.date=d; render(); };
    g.appendChild(b);
  }
  for (const t of S.topics){
    const lab = el("button","rowlabel");
    lab.textContent = t;
    if (S.view==="topic" && S.topic===t) lab.classList.add("sel");
    lab.onclick = () => { S.view="topic"; S.topic=t; render(); };
    g.appendChild(lab);
    for (let n=1;n<=N;n++){
      const d = `${S.ym}-${pad(n)}`;
      const c = el("button","cell");
      c.style.color = tcolor(t);
      if ((S.view==="date" && d===S.date) || (S.view==="topic" && S.topic===t)) c.classList.add("sel");
      c.appendChild(el("span","mk " + cellState(d,t)));
      c.setAttribute("aria-label", `${n}일 ${t}`);
      c.onclick = () => { if (S.view==="topic") S.topic=t; S.date=d; render(); };
      g.appendChild(c);
    }
  }
}

function inputRow(ph, done){
  const w = el("div","inline");
  const i = el("input"); i.placeholder = ph;
  const b = el("button"); b.textContent = "저장";
  const go = () => { const v = i.value.trim(); if (v) done(v); };
  b.onclick = go;
  i.onkeydown = e => { if (e.key==="Enter") go(); if (e.key==="Escape"){ S.open=null; render(); } };
  w.append(i,b);
  setTimeout(()=>i.focus(),0);
  return w;
}

// 항목 편집창. 수정·순서·삭제가 여기 모인다.
function editRow(initial, on){
  const w = el("div","editwrap");
  const r1 = el("div","edit");
  const i = el("input"); i.value = initial; i.setAttribute("aria-label","계획 수정");
  const b = el("button","save"); b.textContent = "저장";
  const go = () => {
    const v = i.value.trim();
    if (v && v !== initial) on.save(v);
    else { S.open = null; render(); }
  };
  b.onclick = go;
  i.onkeydown = e => { if (e.key==="Enter") go(); if (e.key==="Escape"){ S.open=null; render(); } };
  r1.append(i,b);

  const r2 = el("div","editbar");
  const up = el("button","movebtn"); up.textContent = "↑ 위로";   up.disabled = !on.canUp;   up.onclick = () => on.move(-1);
  const dn = el("button","movebtn"); dn.textContent = "↓ 아래로"; dn.disabled = !on.canDown; dn.onclick = () => on.move(1);
  const x  = el("button","delbtn");  x.textContent = "삭제"; x.title = "코멘트까지 지웁니다";
  x.onclick = on.del;                                  // 확인창 없이
  r2.append(up, dn, el("span","spacer"), x);

  w.append(r1, r2);
  // 열 때만 포커스를 준다. 순서를 바꿀 때마다 키보드가 올라오면 성가시다.
  if (S.focusEdit){
    S.focusEdit = false;
    setTimeout(() => { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 0);
  }
  return w;
}

// 좌우로 밀면 날짜를 넘긴다. 세로 스크롤과 겹치지 않게 가로가 확실할 때만.
function attachSwipe(node, go){
  let x0 = 0, y0 = 0, t0 = 0, on = false;
  node.addEventListener("pointerdown", e => {
    on = !e.target.closest(".grid-scroll, input, textarea, button, pre");
    x0 = e.clientX; y0 = e.clientY; t0 = Date.now();
  });
  node.addEventListener("pointerup", e => {
    if (!on) return;
    on = false;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    if (Date.now() - t0 > 700) return;                       // 느긋한 동작은 스와이프가 아니다
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    go(dx < 0 ? 1 : -1);                                     // 왼쪽으로 밀면 다음 날
  });
  node.addEventListener("pointercancel", () => { on = false; });
}

function card(d,t){
  const path = cellPath(d,t), rec = S.store[path];

  if (!S.present.has(path)){
    const e = el("div","empty"); e.style.color = tcolor(t);
    e.innerHTML = `<span class="name">${t}</span><span class="msg">아직 안 씀</span>`;
    const b = el("button"); b.textContent = "쓰기";
    b.onclick = () => {
      S.store[path] = { text:"", sha:null };
      mutate(path, {k:"tpl", d, t}, `add ${d} ${t}`);
      S.open = path + "::new";
    };
    e.appendChild(b); return e;
  }
  if (!rec){
    const e = el("div","empty"); e.style.color = tcolor(t);
    e.innerHTML = `<span class="name">${t}</span><span class="msg">불러오는 중</span>`;
    return e;
  }

  const c = el("div","card"); c.style.color = tcolor(t);
  const top = el("div","card-top");
  const nm = el("button","card-name"); nm.textContent = t;
  nm.onclick = () => { S.view="topic"; S.topic=t; S.date=d; render(); };
  top.append(nm, el("span","spacer"));
  const rb = el("button","rawbtn");
  rb.textContent = S.raw.has(path) ? "원본 닫기" : "원본";
  rb.onclick = () => { S.raw.has(path) ? S.raw.delete(path) : S.raw.add(path); render(); };
  top.appendChild(rb);
  c.appendChild(top);

  let sect = null, list = null;
  const newSect = title => {
    sect = el("div","sect");
    if (title){ const h = el("h3"); h.textContent = title; sect.appendChild(h); }
    list = null; c.appendChild(sect);
  };

  for (const b of parse(rec.text)){
    if (b.kind === "h"){ newSect(b.text); continue; }
    if (!sect) newSect(null);
    if (b.kind === "p"){ const p = el("p","note"); p.textContent = b.text; sect.appendChild(p); continue; }

    if (!list){ list = el("ul","items"); sect.appendChild(list); }
    const li = el("li","item" + (b.done ? " done" : ""));
    const row = el("div","row");
    const box = el("button","box" + (b.done ? " on" : ""));
    box.innerHTML = `<svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3 L5 8.6 L9.5 3.6"/></svg>`;
    box.setAttribute("aria-pressed", b.done);
    box.onclick = () => mutate(path, {k:"toggle", ln:b.ln, prev:b.text}, `${b.done?"uncheck":"check"} ${d} ${t}`);

    const tx = el("div","txt"); tx.textContent = b.text;
    const ac = el("button","addc"); ac.textContent = "+"; ac.title = "실행 코멘트";
    ac.onclick = () => { S.open = path+"::"+b.ln; render(); };
    const ekey = path+"::edit::"+b.ln;
    const eb = el("button","addc editb"); eb.textContent = "⋯"; eb.title = "수정·순서·삭제";
    eb.setAttribute("aria-label", "항목 수정");
    eb.onclick = () => {
      const open = S.open !== ekey;
      S.open = open ? ekey : null;
      S.focusEdit = open;
      render();
    };
    row.append(box, tx, ac, eb); li.appendChild(row);

    if (b.cmts.length){
      const ul = el("ul","cmts");
      for (const cm of b.cmts){ const x = el("li"); x.textContent = cm; ul.appendChild(x); }
      li.appendChild(ul);
    }
    if (S.open === path+"::"+b.ln)
      li.appendChild(inputRow("실제로는…", v => {
        S.open = null; mutate(path, {k:"comment", ln:b.ln, prev:b.text, s:v}, `note ${d} ${t}`);
      }));
    if (S.open === ekey){
      const mv = dir => ({k:"move", ln:b.ln, prev:b.text, dir});
      li.appendChild(editRow(b.text, {
        canUp:   applyOp(mv(-1), rec.text) !== rec.text,
        canDown: applyOp(mv(1),  rec.text) !== rec.text,
        save: v => { S.open=null; mutate(path, {k:"edit", ln:b.ln, prev:b.text, s:v}, `edit ${d} ${t}`); },
        del: () => { S.open=null; mutate(path, {k:"del",  ln:b.ln, prev:b.text},     `drop ${d} ${t}`); },
        move: dir => {                                   // 옮긴 뒤에도 편집창은 그 항목을 따라간다
          const after = applyOp(mv(dir), rec.text);
          if (after === rec.text) return;
          const nl = findItemLine(after, b.text, b.ln + dir * 2);
          S.open = nl >= 0 ? path+"::edit::"+nl : null;
          mutate(path, mv(dir), `move ${d} ${t}`);
        },
      }));
    }
    list.appendChild(li);
  }

  if (S.open === path+"::new")
    c.appendChild(inputRow("할 일", v => mutate(path, {k:"add", s:v}, `plan ${d} ${t}`)));
  else {
    const ai = el("button","additem"); ai.textContent = "+ 항목";
    ai.onclick = () => { S.open = path+"::new"; render(); };
    c.appendChild(ai);
  }
  if (S.raw.has(path)){ const pre = el("pre","raw"); pre.textContent = rec.text; c.appendChild(pre); }
  return c;
}

/* ═══ 내보내기 ═══════════════════════════════════════
   이번 달을 텍스트 한 덩어리로. 주제뷰에서는 그 주제만. */
function exportMonth(){
  const N = daysIn(S.ym);
  const topics = (S.view === "topic" && S.topic) ? [S.topic] : S.topics;
  const out = [];
  let cells = 0, missing = 0;
  for (let n=1;n<=N;n++){
    const d = `${S.ym}-${pad(n)}`;
    for (const t of topics){
      const p = cellPath(d,t);
      if (!S.present.has(p)) continue;
      const rec = S.store[p];
      out.push("=== " + cellName(d,t));
      if (rec){ out.push(rec.text.replace(/\s+$/,"")); cells++; }
      else    { out.push("(불러오지 못했습니다)"); missing++; }
      out.push("");
    }
  }
  return { text: out.join("\n").replace(/\n+$/,"\n"), cells, missing };
}

async function copyText(s){
  try { await navigator.clipboard.writeText(s); return true; } catch(e){}
  try {                                            // 클립보드 API가 막힌 경우
    const ta = document.createElement("textarea");
    ta.value = s; ta.setAttribute("readonly","");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function exportPanel(){
  const { text, cells, missing } = exportMonth();
  const p = el("div","panel");
  const h = el("div","phead");
  const t = el("h3"); t.textContent = "내보내기";
  const sub = el("span","sub");
  sub.textContent = `${+S.ym.slice(5)}월` + (S.view === "topic" && S.topic ? ` · ${S.topic}` : "") + ` · ${cells}칸`;
  const cp = el("button","pbtn solid"); cp.textContent = "복사";
  cp.disabled = !text.trim();
  cp.onclick = async () => {
    const ok = await copyText(text);
    cp.textContent = ok ? "복사됨" : "복사 실패";
    setTimeout(() => { cp.textContent = "복사"; }, 1400);
  };
  const x = el("button","pbtn"); x.textContent = "닫기";
  x.onclick = () => { S.exportOpen = false; render(); };
  h.append(t, sub, el("span","spacer"), cp, x);
  p.appendChild(h);

  const pre = el("pre","raw export");
  pre.textContent = text.trim() ? text : "이번 달에는 기록이 없습니다.";
  p.appendChild(pre);

    const w = el("p","pnote warn");
    w.textContent = `${missing}칸은 아직 불러오지 못했습니다. 잠시 뒤 다시 열어보세요.`;
    p.appendChild(w);
  }
  return p;
}

/* ═══ 주제 관리 ══════════════════════════════════════
   추가와 숨김만. 숨김은 topics.json에서 빼는 것뿐이고
   이미 쓴 md 파일은 저장소에 그대로 남는다.          */

    hb.title = "목록에서만 뺍니다. 기록은 지워지지 않습니다.";

  p.appendChild(ul);

  const w = el("div","inline"); w.style.margin = "0";
  const i = el("input"); i.placeholder = "새 주제"; i.setAttribute("aria-label","새 주제");
  const b = el("button"); b.textContent = "추가";
  const go = () => {
    const v = nfc(i.value.trim());
    if (!v) return;
    if (/[\/\\]/.test(v) || v.startsWith(".")){ S.topicMsg = "이름에 / \\ 는 쓸 수 없고 점으로 시작할 수 없습니다."; render(); return; }
    if (S.topics.includes(v)){ S.topicMsg = "이미 있는 주제입니다."; render(); return; }
    S.topicMsg = "";
    mutate(TOPICS_PATH, {k:"topicAdd", name:v}, `add topic ${v}`);
  };
  b.onclick = go;
  i.onkeydown = e => { if (e.key === "Enter") go(); };
  w.append(i,b);
  p.appendChild(w);

  if (S.topicMsg){ const m = el("p","pnote warn"); m.textContent = S.topicMsg; p.appendChild(m); }
  const n = el("p","pnote");
  n.textContent = "숨기기는 topics.json에서 이름만 뺍니다. 이미 쓴 기록 파일은 그대로 남고, 같은 이름을 다시 추가하면 다시 보입니다. 색은 순서대로 자동 배정됩니다.";
  p.appendChild(n);
  return p;
}

function render(){
  const root = document.getElementById("root");
  if (!root.querySelector(".app")){
    root.innerHTML = `<div class="app">
      <div class="top">
        <div class="bar">
          <button class="nav" id="prev">‹</button>
          <span class="month" id="monthLbl"></span>
          <button class="nav" id="next">›</button>
          <span class="spacer"></span>
          <span class="status" id="status"></span>
          <button class="pending" id="pending" hidden></button>
          <button class="gear" id="topics">주제</button>
          <button class="gear" id="gear">설정</button>
        </div>
        <div class="grid-scroll" id="gridScroll"><div class="grid" id="grid"></div></div>
      </div>
      <div class="viewhead" id="viewhead"></div>
      <div class="stack" id="stack"></div>
    </div>`;
    document.getElementById("prev").onclick = () => shiftMonth(-1);
    document.getElementById("next").onclick = () => shiftMonth(1);
    attachSwipe(root.querySelector(".app"), k => { if (S.view === "date") shiftDate(k); });
    document.getElementById("pending").onclick = () => flushQueue();
    document.getElementById("topics").onclick = () => {
      S.topicsOpen = !S.topicsOpen; S.topicMsg = "";
      if (S.topicsOpen) window.scrollTo({ top:0 });
      render();
    };
    document.getElementById("gear").onclick = () => {
      if (confirm("설정을 지우고 다시 연결할까요? 기록은 저장소에 그대로 남습니다."))
        { localStorage.removeItem(CFG_KEY); location.reload(); }
    };
  }

  syncTopics();
  document.getElementById("monthLbl").textContent = `${+S.ym.slice(5)}월`;
  paintStatus();
  drawGrid(document.getElementById("grid"));

  const vh = document.getElementById("viewhead"), st = document.getElementById("stack");
  vh.innerHTML = ""; st.innerHTML = "";
  if (S.topicsOpen) st.appendChild(topicPanel());
  if (S.exportOpen) st.appendChild(exportPanel());

  if (S.view === "date"){
    const n = +S.date.slice(-2);
    vh.innerHTML = `<h2>${+S.ym.slice(5)}월 ${n}일 ${dow(S.date)}요일</h2>
      <span class="sub">${S.date===TODAY ? "오늘" : ""}</span>`;
    for (const t of S.topics) st.appendChild(card(S.date, t));
    if (!S.topics.length){
      const e = el("div","empty");
      e.innerHTML = `<span class="msg">주제가 없습니다. 위 ‘주제’에서 추가하세요.</span>`;
      st.appendChild(e);
    }
  } else {
    vh.innerHTML = `<h2>${S.topic}</h2><span class="sub">${+S.ym.slice(5)}월</span>`;
    const N = daysIn(S.ym);
    let any = false;
    for (let n=1;n<=N;n++){
      const d = `${S.ym}-${pad(n)}`;
      if (!S.present.has(cellPath(d, S.topic))) continue;
      any = true;
      const h = el("div","datehead");
      const b = el("button"); b.textContent = `${+S.ym.slice(5)}월 ${n}일`;
      b.onclick = () => { S.view="date"; S.date=d; render(); };
      const w = el("span","dow2"); w.textContent = dow(d);
      h.append(b,w); h.dataset.date = d;
      st.append(h, card(d, S.topic));
    }
    if (!any){
      const e = el("div","empty"); e.style.color = tcolor(S.topic);
      e.innerHTML = `<span class="msg">이번 달 기록이 없습니다. 위 그리드에서 날짜를 고르세요.</span>`;
      st.appendChild(e);
    }
    const a = (S.topicsOpen || S.exportOpen) ? null : st.querySelector(`[data-date="${S.date}"]`);
    if (a) requestAnimationFrame(() =>
      window.scrollTo({ top: a.getBoundingClientRect().top + window.scrollY - 118 }));
  }

  vh.appendChild(el("span","spacer"));
  const xb = el("button","rawbtn");
  xb.textContent = S.exportOpen ? "내보내기 닫기" : "내보내기";
  xb.onclick = () => {
    S.exportOpen = !S.exportOpen;
    if (S.exportOpen) window.scrollTo({ top:0 });
    render();
  };
  vh.appendChild(xb);

  const sc = document.getElementById("gridScroll");
  const sel = sc.querySelector(".dayhead.sel") || sc.querySelector(".dayhead.is-today");
  if (sel && S.view === "date") sel.scrollIntoView({ block:"nearest", inline:"center" });
}

// 날짜 하나로 옮긴다. 달을 넘어가면 그 달을 불러온다.
async function goToDate(d){
  S.view = "date"; S.date = d; S.open = null;
  const ym = d.slice(0,7);
  if (ym === S.ym){ render(); return; }
  S.ym = ym; render();
  try { await loadMonth(ym); } catch(e){ setStatus(e.message, true); }
}
const shiftDate = k => {
  const t = new Date(S.date + "T12:00:00");
  t.setDate(t.getDate() + k);
  goToDate(localDate(t));
};

// 자정을 넘겨도 앱을 켜둔 채면 오늘이 어제로 남는다. 주기적으로 다시 본다.
function refreshToday(){
  const now = localDate();
  if (now === TODAY) return;
  const wasOnToday = S.date === TODAY;
  TODAY = now;
  if (wasOnToday && S.view === "date") goToDate(TODAY);   // 옮겨다니지 않았다면 따라간다
  else render();
}

async function shiftMonth(k){
  const [y,m] = S.ym.split("-").map(Number);
  const d = new Date(y, m-1+k, 1);
  S.ym = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  S.date = `${S.ym}-01`;
  render();
  try { await loadMonth(S.ym); } catch(e){ setStatus(e.message, true); }
}

/* ═══ 첫 연결 화면 ═══════════════════════════════════ */
function setupScreen(){
  document.getElementById("root").innerHTML = `<div class="setup">
    <h1>저장소에 연결</h1>
    <p class="lead">기록은 이 기기가 아니라 깃허브 저장소에 저장됩니다. 토큰은 이 폰에만 남습니다.</p>
    <div class="fld"><label for="o">깃허브 계정명</label><input id="o" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="fld"><label for="r">저장소 이름</label><input id="r" value="mylog" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="fld"><label for="t">액세스 토큰</label><input id="t" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">Settings → Developer settings → Fine-grained tokens에서 발급. Contents를 Read and write로.</div></div>
    <button class="go" id="go">연결</button>
    <div class="msg" id="msg"></div>
  </div>`;
  const msg = document.getElementById("msg");
  document.getElementById("go").onclick = async () => {
    const owner = document.getElementById("o").value.trim();
    const repo  = document.getElementById("r").value.trim();
    const token = document.getElementById("t").value.trim();
    if (!owner || !repo || !token){ msg.textContent = "세 칸 모두 채워주세요."; return; }
    msg.textContent = "확인 중…";
    CFG = { owner, repo, token, branch:"main" };
    try {
      const r = await fetch(`${API}/repos/${owner}/${repo}`, { headers: hdr() });
      if (!r.ok) throw new Error(await why(r));
      CFG.branch = (await r.json()).default_branch || "main";
      localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
      boot();
    } catch(e){ CFG = null; msg.textContent = e.message; }
  };
}

/* ═══ 시작 ═══════════════════════════════════════════ */
async function boot(){
  if (!CFG){ setupScreen(); return; }
  document.getElementById("root").innerHTML = "";
  try {
    S.topics = await loadTopics();
    S.topic  = S.topics[0];
    render();
    await flushQueue();              // 지난번에 못 보낸 편집부터
    await loadMonth(S.ym);
  } catch(e){
    render();
    setStatus(e.message, true);
  }
}

// 온라인으로 돌아오면 알아서 다시 보낸다
window.addEventListener("online",  () => { setStatus(""); flushQueue(); });
window.addEventListener("offline", () => paintStatus());
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refreshToday();                                    // 하루 넘겨 다시 열었을 수 있다
  flushQueue();
});
setInterval(() => { refreshToday(); if (QUEUE.length) flushQueue(); }, 30000);

boot();
</script>
